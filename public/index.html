<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="spotify-container">
        <div class="sidebar">
            <div class="logo">
                <i class="fab fa-spotify"></i>
                <span>SpotifyDl</span>
            </div>
            
            <ul class="nav-links">
                <li class="active"><i class="fas fa-home"></i> <span>Home</span></li>
                <li><i class="fas fa-search"></i> <span>Search</span></li>
                <li><i class="fas fa-book"></i> <span>Your Library</span></li>
            </ul>

            <div class="sidebar-divider"></div>

            <ul class="nav-links scrollable">
                <li><div class="playlist-box"><i class="fas fa-plus-square"></i> <span>Create Playlist</span></div></li>
                <li><div class="playlist-box"><i class="fas fa-heart"></i> <span>Liked Songs</span></div></li>
            </ul>
            
            <div class="legal">
                <span>Cookies</span>
                <span>Privacy</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="nav-arrows">
                    <div class="arrow-circle"><i class="fas fa-chevron-left"></i></div>
                    <div class="arrow-circle"><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="user-actions">
                    <button class="pill-btn">Explore Premium</button>
                    <div class="profile-icon"><i class="far fa-user"></i></div>
                </div>
            </div>

            <div class="content-scroll">
                <div class="hero-section">
                    <h1>Download Music</h1>
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="spotifyUrl" placeholder="Paste Spotify link here (Track, Playlist)...">
                        <button id="downloadBtn" class="play-btn">GO</button>
                    </div>
                </div>

                <div id="resultArea" class="result-section hidden">
                    <h2>Best Result</h2>
                    <div class="track-card">
                        <img id="albumArt" src="" alt="Album Art">
                        <div class="track-info">
                            <h3 id="trackTitle">Track Title</h3>
                            <p id="artistName">Artist Name</p>
                            <div class="badges">
                                <span class="badge">SONG</span>
                            </div>
                            <a id="dlLink" href="#" target="_blank" class="spotify-btn">
                                Download MP3
                            </a>
                        </div>
                    </div>
                </div>

                <div class="recommendations">
                    <h2>Made for you</h2>
                    <div class="card-grid">
                        <div class="music-card">
                            <div class="img-placeholder" style="background: #535353;"></div>
                            <h4>Daily Mix 1</h4>
                            <p>Just for you</p>
                        </div>
                        <div class="music-card">
                            <div class="img-placeholder" style="background: #535353;"></div>
                            <h4>Discover Weekly</h4>
                            <p>New music</p>
                        </div>
                        <div class="music-card">
                            <div class="img-placeholder" style="background: #535353;"></div>
                            <h4>Top Hits</h4>
                            <p>Global</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-decoration">
        <i class="fas fa-music"></i>
        <i class="fas fa-headphones-alt"></i>
        <i class="fab fa-spotify"></i>
        <i class="fas fa-record-vinyl"></i>
    </div>

    <div class="main-container">
        <div class="card">
            <div id="inputView" class="view-section">
                <div class="logo-section">
                    <i class="fab fa-spotify logo-icon"></i>
                    <h1>Spotify <span>Downloader</span></h1>
                    <p>High-quality MP3 streaming & download</p>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-link link-icon"></i>
                    <input type="text" id="spotifyUrl" placeholder="Paste Spotify track link...">
                </div>

                <button id="downloadBtn" class="main-btn">
                    <i class="fas fa-bolt"></i> Download Music
                </button>
            </div>

            <div id="resultView" class="view-section hidden">
                <div class="logo-section-small">
                    <i class="fab fa-spotify logo-icon-small"></i>
                    <h2>Spotify <span>Downloader</span></h2>
                </div>

                <div class="track-info-card">
                    <img id="albumArt" src="" alt="Album Art" class="album-cover">
                    <h3 id="trackTitle">Track Title</h3>
                    <p id="artistName">Artist Name</p>
                    
                    <div class="meta-badges">
                        <span class="badge-pill"><i class="far fa-clock"></i> <span id="durationTxt">N/A</span></span>
                        <span class="badge-pill badge-green"><i class="far fa-file-audio"></i> <span id="sizeTxt">N/A</span></span>
                    </div>
                </div>

                <a id="dlLink" href="#" target="_blank" class="main-btn download-btn">
                    <i class="fas fa-download"></i> Download MP3
                </a>

                <button id="resetBtn" class="text-btn">Download another</button>
            </div>

            <div id="loadingView" class="view-section hidden">
                 <div class="logo-section">
                    <i class="fab fa-spotify logo-icon pulse"></i>
                    <h2>Processing...</h2>
                    <p>Please wait while we fetch your track.</p>
                </div>
            </div>

        </div>

        <footer class="credit-footer">
            <p>SANN404 FORUM</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
